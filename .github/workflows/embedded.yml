name: 'Build & Publish Embedded (Servo) Desktop App'

on:
  push:
    tags:
      - 'v*'

env:
  SERVO_TAG: '0.4.0'

jobs:
  # ── Create the release exactly once before the matrix starts ────────────────
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: create release
        run: |
          gh release view "${{ github.ref_name }}" 2>/dev/null || \
          gh release create "${{ github.ref_name }}" \
            --title "App v$(jq -r '.version' src-tauri/tauri.conf.json)" \
            --notes "See the assets to download this version and install." \
            2>/dev/null || \
          gh release view "${{ github.ref_name }}" > /dev/null
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Build and upload per platform ───────────────────────────────────────────
  publish-embedded:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            servo_asset: 'servo-x86_64-windows-msvc.zip'
            os_name: 'windows'
            arch: 'x64'
          - platform: 'macos-latest'
            servo_asset: 'servo-aarch64-apple-darwin.dmg'
            os_name: 'macos'
            arch: 'aarch64'
          - platform: 'macos-latest'
            servo_asset: 'servo-x86_64-apple-darwin.dmg'
            os_name: 'macos'
            arch: 'x86_64'
          - platform: 'ubuntu-22.04'
            servo_asset: 'servo-x86_64-linux-gnu.tar.gz'
            os_name: 'linux'
            arch: 'x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: install frontend dependencies
        run: npm i

      # No TAURI_ENV_* vars are set here on purpose: they're only ever set by the
      # Tauri CLI, and vite.config.ts's own `!!process.env.TAURI_ENV_TARGET_TRIPLE`
      # check needs them absent to correctly report this as a non-Tauri build.
      # EMBEDDED_TARGET is this pipeline's own signal instead (read by .assetpack.ts
      # and baked into __EMBEDDED_TARGET__ for the frontend, see vite.config.ts).
      - name: build frontend
        run: npm run build
        env:
          EMBEDDED_TARGET: servo

      - name: read app name/version
        id: meta
        shell: bash
        run: |
          echo "bin_name=$(grep '^name = ' src-tauri/Cargo.toml | head -1 | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.version' src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      # ── Linux: download the servoshell tarball, unpack next to dist/ ────────
      #
      # Unlike the Windows zip (which bundles every gst*.dll it needs), the Linux
      # tarball assumes the host system already has GStreamer installed — but as
      # of servo 0.4.0 it links against libgstplay-1.0.so.0 / libgstwebrtc(nice),
      # which are NOT packaged by Ubuntu 22.04/24.04 (confirmed by hand: apt only
      # ships the older libgstplayer, never libgstplay). So this step bundles
      # whatever gstreamer-bad libs apt *can* provide into release/libs/, wires
      # LD_LIBRARY_PATH in play.sh to use them, then hard-fails the job with an
      # explicit ldd report if anything is still unresolved — rather than silently
      # shipping a zip that fails to start on the end user's machine.
      - name: assemble release (Linux)
        if: matrix.os_name == 'linux'
        run: |
          curl -fsSL -o servo.tar.gz \
            "https://github.com/servo/servo/releases/download/${SERVO_TAG}/${{ matrix.servo_asset }}"
          mkdir release
          tar -xzf servo.tar.gz -C release
          mv release/servo/* release/
          rmdir release/servo
          cp -r dist release/dist

          mkdir release/libs
          sudo apt-get update
          sudo apt-get download libgstreamer-plugins-bad1.0-0 libnice10 2>&1 || true
          for deb in *.deb; do
            [ -f "$deb" ] || continue
            dpkg-deb -x "$deb" "$PWD/deb-extract"
          done
          find "$PWD/deb-extract" -name "*.so*" -exec cp -Pn {} release/libs/ \; 2>/dev/null || true

          cat > release/play.sh << 'EOF'
          #!/usr/bin/env bash
          cd "$(dirname "$0")"
          chmod +x ./servoshell
          export LD_LIBRARY_PATH="$PWD/libs:$LD_LIBRARY_PATH"
          ./servoshell "dist/index.html" --window-size 1280x720 \
            --pref dom_allow_scripts_to_close_windows=true
          EOF
          chmod +x release/play.sh release/servoshell

      - name: verify Linux binary actually starts (no missing shared libs)
        if: matrix.os_name == 'linux'
        run: |
          export LD_LIBRARY_PATH="$PWD/release/libs:$LD_LIBRARY_PATH"
          MISSING=$(ldd release/servoshell | grep "not found" || true)
          if [ -n "$MISSING" ]; then
            echo "::error::servoshell is missing shared libraries that could not be bundled from apt:"
            echo "$MISSING"
            echo "::error::These aren't packaged by Ubuntu as of this workflow's writing (see comment above)."
            echo "::error::A newer/self-built GStreamer providing them is needed before this release is safe to ship."
            exit 1
          fi
          echo "All shared library dependencies resolved:"
          ldd release/servoshell

      # ── Windows: download the servoshell zip, unpack next to dist/ ──────────
      - name: assemble release (Windows)
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/servo/servo/releases/download/$env:SERVO_TAG/${{ matrix.servo_asset }}" -OutFile servo.zip
          Expand-Archive -Path servo.zip -DestinationPath release_tmp
          New-Item -ItemType Directory -Path release | Out-Null
          Move-Item release_tmp/servo/* release/
          Copy-Item -Recurse dist release/dist
          @'
          @echo off
          cd /d "%~dp0"
          servoshell.exe "dist\index.html" --window-size 1280x720 ^
            --pref dom_allow_scripts_to_close_windows=true
          '@ | Out-File -Encoding ascii release/play.bat

      # ── macOS: mount the dmg, pull the .app bundle's binary + resources ─────
      # NOTE: servo/servo ships macOS builds as a .dmg app bundle, whose exact
      # Contents/ layout could not be verified from a non-macOS sandbox — this
      # step locates things by search rather than a hardcoded path, but treat
      # its first real run as the actual verification.
      - name: assemble release (macOS)
        if: matrix.os_name == 'macos'
        run: |
          curl -fsSL -o servo.dmg \
            "https://github.com/servo/servo/releases/download/${SERVO_TAG}/${{ matrix.servo_asset }}"
          MOUNT_DIR=$(mktemp -d)
          hdiutil attach servo.dmg -nobrowse -mountpoint "$MOUNT_DIR"

          APP_BUNDLE=$(find "$MOUNT_DIR" -maxdepth 2 -name "*.app" | head -1)
          if [ -z "$APP_BUNDLE" ]; then
            echo "::error::No .app bundle found inside servo.dmg — inspect the dmg layout manually"
            hdiutil detach "$MOUNT_DIR" || true
            exit 1
          fi

          BINARY=$(find "$APP_BUNDLE/Contents/MacOS" -type f | head -1)
          if [ -z "$BINARY" ]; then
            echo "::error::No executable found under $APP_BUNDLE/Contents/MacOS"
            hdiutil detach "$MOUNT_DIR" || true
            exit 1
          fi

          mkdir release
          cp "$BINARY" release/servoshell
          chmod +x release/servoshell
          if [ -d "$APP_BUNDLE/Contents/Resources/resources" ]; then
            cp -r "$APP_BUNDLE/Contents/Resources/resources" release/resources
          elif [ -d "$APP_BUNDLE/Contents/Resources" ]; then
            cp -r "$APP_BUNDLE/Contents/Resources" release/resources
          fi
          hdiutil detach "$MOUNT_DIR" || true

          cp -r dist release/dist
          cat > release/play.sh << 'EOF'
          #!/usr/bin/env bash
          cd "$(dirname "$0")"
          chmod +x ./servoshell
          ./servoshell "dist/index.html" --window-size 1280x720 \
            --pref dom_allow_scripts_to_close_windows=true
          EOF
          chmod +x release/play.sh

      - name: zip release (Linux/macOS)
        if: matrix.os_name != 'windows'
        run: |
          ZIP="${{ steps.meta.outputs.bin_name }}_${{ steps.meta.outputs.version }}_${{ matrix.os_name }}_${{ matrix.arch }}-servoshell.zip"
          (cd release && zip -r "../$ZIP" .)
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: zip release (Windows)
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          $zip = "${{ steps.meta.outputs.bin_name }}_${{ steps.meta.outputs.version }}_windows_x64-servoshell.zip"
          Compress-Archive -Path release/* -DestinationPath $zip
          echo "ZIP=$zip" >> $env:GITHUB_ENV

      - name: upload artifact to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.release_tag }}
        run: gh release upload "$TAG" "$ZIP" --clobber
